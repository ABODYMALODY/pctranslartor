name: Build PC program

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Put files in their folders (works however they were uploaded)
        run: |
          if [ -f game_translator/main.py ]; then
            echo "Layout: game_translator folder"
          elif [ -f main.py ] && [ -d app ]; then
            echo "Layout: main.py and app folder at the top"
            mkdir -p game_translator
            cp -r app main.py requirements.txt game_translator/
          else
            echo "Layout: all files without folders"
            mkdir -p game_translator/app
            cp main.py requirements.txt game_translator/
            for f in *.py; do
              [ "$f" = "main.py" ] && continue
              cp "$f" game_translator/app/
            done
          fi
          [ -s game_translator/app/__init__.py ] || echo '"""Game Translator."""' > game_translator/app/__init__.py
          ls -R game_translator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        working-directory: game_translator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check that the program's code is all there
        working-directory: game_translator
        run: python -c "import app.main_window, app.pipeline, app.tv_link; print('All app files found')"

      - name: Download the OCR models now, so they are inside the program
        working-directory: game_translator
        run: python -c "from rapidocr import RapidOCR; RapidOCR()"

      - name: Build GameTranslator.exe
        working-directory: game_translator
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name GameTranslator \
            --paths . --collect-submodules app \
            --collect-all rapidocr --collect-all onnxruntime main.py
          cd dist && 7z a -tzip ../../GameTranslator-Windows.zip GameTranslator

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v${{ github.run_number }}
          name: Game Translator PC ${{ github.run_number }}
          files: GameTranslator-Windows.zip
          make_latest: false
